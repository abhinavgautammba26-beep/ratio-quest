<title>Ratio Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a station-board game. Sticky scoreboard on top, a signal-lamp map of five ratio worlds, then one big panel per step. Green/amber/red lamps carry the verdicts. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface2:#E6EBF3; --ink:#0F1B2D; --muted:#4B5A74; --line:#CBD3E1;
  --accent:#2447D6; --accent-ink:#FFFFFF; --good:#0B7446; --good-bg:#DCF3E7; --warn:#8F5600; --warn-bg:#FFEFCF; --bad:#B3261E; --bad-bg:#FCE2DF;
  --head:#0F1B2D; --head-ink:#F3F6FC; --gold:#E9A800;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1322; --surface:#141F36; --surface2:#1C2A47; --ink:#EEF2FA; --muted:#A3B1CB; --line:#2C3C5E;
  --accent:#8AA3FF; --accent-ink:#0B1322; --good:#58D79C; --good-bg:#12392B; --warn:#F2B64A; --warn-bg:#3A2D10; --bad:#FF8F85; --bad-bg:#46191B;
  --head:#070D19; --head-ink:#EEF2FA; --gold:#F4C23D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1322; --surface:#141F36; --surface2:#1C2A47; --ink:#EEF2FA; --muted:#A3B1CB; --line:#2C3C5E;
  --accent:#8AA3FF; --accent-ink:#0B1322; --good:#58D79C; --good-bg:#12392B; --warn:#F2B64A; --warn-bg:#3A2D10; --bad:#FF8F85; --bad-bg:#46191B;
  --head:#070D19; --head-ink:#EEF2FA; --gold:#F4C23D; color-scheme:dark}
*{box-sizing:border-box}
html{font-size:22px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 3rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:2rem;font-weight:800} h3{font-size:1.35rem;font-weight:800}
p{margin:.4rem 0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* scoreboard */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:.6rem max(16px,env(safe-area-inset-left,0px));}
.hud-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:.6rem 1.4rem;align-items:center}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.6rem;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.brand span{color:var(--gold)}
.xp{flex:1 1 280px;min-width:0}
.xp-top{display:flex;justify-content:space-between;gap:.5rem;font-size:.85rem;flex-wrap:wrap}
.bar{height:.7rem;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .5s}
.hud-btn{background:transparent;border:2px solid rgba(255,255,255,.35);color:inherit;border-radius:.6rem;padding:.2rem .7rem;font-size:.85rem}
/* generic */
.card{background:var(--surface);border:2px solid var(--line);border-radius:1rem;padding:1.1rem 1.3rem}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:.8rem;padding:.65rem 1.3rem;font-weight:700;font-size:1rem}
.btn.alt{background:var(--surface2);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;border-radius:99px;padding:.1rem .8rem;font-weight:700;font-size:.85rem}
.good{background:var(--good-bg);color:var(--good)} .warn{background:var(--warn-bg);color:var(--warn)} .bad{background:var(--bad-bg);color:var(--bad)} .info{background:var(--surface2);color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:1rem}
/* home */
.hero{padding:2rem 0 1rem}
.hero h1{font-size:clamp(2.6rem,7vw,4.4rem);font-weight:800}
.hero p{font-size:1.2rem;max-width:44ch}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1rem;margin-top:1rem}
.world{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:1rem;padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.4rem;color:var(--ink);min-width:0}
.world:hover{border-color:var(--accent);transform:translateY(-2px)}
.world .tag{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.world .stars{font-size:1.5rem;letter-spacing:.15rem;color:var(--gold)} .world .stars .off{color:var(--line)}
.world.arena{background:var(--head);color:var(--head-ink);border-color:var(--head)} .world.arena .tag{color:var(--gold)}
.lamp{width:1rem;height:1rem;border-radius:50%;display:inline-block;margin-right:.4rem;background:var(--line)}
/* world view */
.crumbs{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:1.2rem 0 .8rem}
.steps{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0 1rem}
.step{background:var(--surface2);border:2px solid var(--line);color:var(--ink);border-radius:.8rem;padding:.5rem 1.1rem;font-weight:700}
.step[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.step .ck{color:var(--good)} .step[aria-selected="true"] .ck{color:var(--accent-ink)}
.formula{font-family:var(--f-mono);font-weight:700;font-size:1.25rem;background:var(--surface2);border-radius:.7rem;padding:.6rem .9rem;margin:.4rem 0;overflow-wrap:anywhere}
.learn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:1rem}
.eg{border-left:6px solid var(--gold);padding:.2rem 0 .2rem .9rem;margin-top:.6rem}
/* build */
.slotbox{display:flex;flex-direction:column;align-items:stretch;gap:.4rem;max-width:520px}
.slot{min-height:3.4rem;border:3px dashed var(--line);border-radius:.8rem;display:flex;align-items:center;justify-content:center;padding:.3rem .8rem;text-align:center;font-weight:700;background:var(--surface)}
.slot.over{border-color:var(--accent);background:var(--surface2)}
.slot.filled{border-style:solid;border-color:var(--accent)}
.slot.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.slot.no{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.vinc{height:5px;background:var(--ink);border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:.6rem;margin:.8rem 0}
.chip{background:var(--accent);color:var(--accent-ink);border:0;border-radius:.7rem;padding:.55rem 1rem;font-weight:700;cursor:grab;user-select:none;touch-action:none}
.chip.sel{outline:4px solid var(--gold)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:1rem;align-items:center;padding:1rem 0;border-top:2px solid var(--line)}
@media(max-width:700px){.qrow{grid-template-columns:1fr}}
/* lab */
.co-tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin:.4rem 0 1rem}
.mission{background:var(--warn-bg);color:var(--ink);border:2px solid var(--gold);border-radius:1rem;padding:.8rem 1.1rem;margin-bottom:1rem}
.mission.done{background:var(--good-bg);border-color:var(--good)}
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:1.2rem;align-items:start}
@media(max-width:900px){.lab{grid-template-columns:1fr}}
.inp{display:grid;grid-template-columns:1fr auto;gap:.2rem .6rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line)}
.inp label{font-weight:700}
.inp input[type=number]{width:7.2rem;font:inherit;font-family:var(--f-mono);font-weight:700;padding:.3rem .5rem;border:2px solid var(--line);border-radius:.6rem;background:var(--surface);color:var(--ink);text-align:right}
.inp input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);height:1.6rem}
.derived{background:var(--surface2);border-radius:.8rem;padding:.6rem .9rem;margin:.6rem 0;font-size:.9rem}
.derived b{font-family:var(--f-mono)}
.rcard{border:2px solid var(--line);border-radius:1rem;padding:.9rem 1.1rem;background:var(--surface);margin-bottom:.9rem}
.rcard.good{border-color:var(--good)} .rcard.warn{border-color:var(--warn)} .rcard.bad{border-color:var(--bad)}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.rval{font-family:var(--f-mono);font-weight:700;font-size:2.4rem;line-height:1}
.gauge{position:relative;height:1.1rem;border-radius:99px;display:flex;overflow:hidden;margin:.7rem 0 .3rem;border:2px solid var(--line)}
.gauge span{display:block;height:100%}
.gauge .z-good{background:var(--good)} .gauge .z-warn{background:#E0A020} .gauge .z-bad{background:var(--bad)}
.pin{position:absolute;top:-.35rem;width:.35rem;height:1.8rem;background:var(--ink);border-radius:3px;transform:translateX(-50%);transition:left .35s;box-shadow:0 0 0 2px var(--surface)}
.scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.says{margin-top:.5rem;font-size:1rem}
.says b{font-weight:700}
/* quiz */
.opt{display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:3px solid var(--line);border-radius:.9rem;padding:.7rem 1rem;margin:.5rem 0;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good)} .opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.scen{background:var(--surface2);border-radius:.8rem;padding:.7rem 1rem;font-size:1rem;margin:.5rem 0}
/* arena */
.tablewrap{overflow-x:auto;border:2px solid var(--line);border-radius:1rem;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:.55rem .8rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--surface2);font-family:var(--f-display)}
td.num{font-family:var(--f-mono);font-weight:700;white-space:nowrap}
tr.grp td{background:var(--surface2);font-family:var(--f-display);font-weight:800}
.best{outline:3px solid var(--gold);outline-offset:-3px}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1rem;margin:1rem 0}
.agrid .inp input[type=number]{width:6rem}
/* toast + badges */
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:.5rem;z-index:40;align-items:flex-end}
.toast{background:var(--head);color:var(--head-ink);border:3px solid var(--gold);border-radius:.9rem;padding:.6rem 1.1rem;font-weight:700;animation:pop .4s}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.badges{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.6rem}
.badge{border:2px solid var(--line);border-radius:.8rem;padding:.4rem .8rem;font-size:.85rem;color:var(--muted)}
.badge.on{border-color:var(--gold);color:var(--ink);background:var(--warn-bg)}
.nav2{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div id="hud" class="hud"></div><div class="wrap"><main id="app"></main></div><div id="toasts" aria-live="polite"></div><script>
/* ===== DATA & ENGINE ===== */
const FIELDS = [
  // key, label, group, min, max, step
  ['cash','Cash + bank','bs',0,200,1],['ms','Marketable securities','bs',0,100,1],['rec','Debtors (receivables)','bs',0,200,1],
  ['inv','Closing stock','bs',0,250,1],['prepaid','Prepaid expenses','bs',0,50,1],['fa','Fixed assets','bs',0,500,5],
  ['ap','Creditors (trade payables)','bs',0,200,1],['ocl','Other current liabilities','bs',0,100,1],['ltd','Long-term debt','bs',0,400,5],['sc','Share capital','bs',10,400,5],
  ['sales','Net sales','pl',100,1500,10],['cashPct','Cash sales (% of sales)','pl',0,100,5],['cogs','Cost of goods sold','pl',50,1300,10],
  ['opex','Operating expenses (cash)','pl',0,400,5],['dep','Depreciation (non-cash)','pl',0,100,1],['interest','Interest (finance cost)','pl',0,80,1],
  ['openInv','Opening stock','pl',0,250,1],['openRec','Opening debtors','pl',0,200,1],['openAp','Opening creditors','pl',0,200,1],
  ['shares','Equity shares (lakh)','mk',1,50,1],['price','Market price per share (Rs.)','mk',5,600,1],['dps','Dividend per share (Rs.)','mk',0,40,0.5]
];
const LBL = Object.fromEntries(FIELDS.map(f=>[f[0],f[1]]));
const PRESETS = {
  A:{name:'Sharma Retail',tag:'Everyday kirana chain',cash:20,ms:10,rec:30,inv:65,prepaid:5,fa:300,ap:55,ocl:30,ltd:120,sc:100,sales:600,cashPct:30,cogs:420,opex:95,dep:20,interest:12,openInv:50,openRec:28,openAp:50,shares:10,price:60,dps:3},
  B:{name:'Verma Mart',tag:'Fast and lean',cash:30,ms:20,rec:20,inv:40,prepaid:5,fa:280,ap:45,ocl:15,ltd:40,sc:100,sales:700,cashPct:60,cogs:480,opex:90,dep:15,interest:4,openInv:38,openRec:22,openAp:40,shares:10,price:190,dps:8},
  C:{name:'Kapoor Stores',tag:'Big and borrowed',cash:5,ms:0,rec:70,inv:110,prepaid:5,fa:300,ap:90,ocl:40,ltd:200,sc:100,sales:650,cashPct:10,cogs:470,opex:90,dep:30,interest:28,openInv:95,openRec:60,openAp:80,shares:10,price:45,dps:1}
};
const TAX = 0.25, CREDIT_PURCH = 0.8;
function calc(c){
  const o={};
  o.CA=c.cash+c.ms+c.rec+c.inv+c.prepaid; o.CL=c.ap+c.ocl; o.TA=o.CA+c.fa; o.CE=o.TA-o.CL;
  o.res=o.CE-c.ltd-c.sc; o.SF=c.sc+o.res;
  o.GP=c.sales-c.cogs; o.EBIT=c.sales-c.cogs-c.opex-c.dep; o.PBT=o.EBIT-c.interest; o.PAT=o.PBT>0?o.PBT*(1-TAX):o.PBT;
  o.creditSales=c.sales*(1-c.cashPct/100); o.purchases=Math.max(0,c.cogs+c.inv-c.openInv); o.creditPurch=o.purchases*CREDIT_PURCH;
  o.dailyExp=(c.cogs+c.opex)/365; o.defAssets=c.cash+c.ms+c.rec;
  o.avgInv=(c.inv+c.openInv)/2; o.avgRec=(c.rec+c.openRec)/2; o.avgAp=(c.ap+c.openAp)/2;
  o.EPS=o.PAT/c.shares; o.BVPS=o.SF/c.shares;
  const d=(a,b)=>b>0?a/b:NaN;
  const v={};
  v.current=d(o.CA,o.CL); v.quick=d(o.CA-c.inv-c.prepaid,o.CL); v.cashr=d(c.cash+c.ms,o.CL); v.bdi=d(o.defAssets,o.dailyExp);
  v.stock=d(c.cogs,o.avgInv); v.dtr=d(o.creditSales,o.avgRec); v.acp=365/v.dtr; v.ctr=d(o.creditPurch,o.avgAp); v.app=365/v.ctr;
  v.gp=d(o.GP,c.sales)*100; v.np=d(o.PAT,c.sales)*100; v.op=d(c.cogs+c.opex+c.dep,c.sales)*100;
  v.roi=d(o.EBIT,o.CE)*100; v.roe=d(o.PAT,o.SF)*100; v.roa=d(o.PAT,o.TA)*100;
  v.de=d(c.ltd,o.SF); v.gear=d(c.ltd,o.CE); v.eqr=d(o.SF,o.CE); v.ic=d(o.EBIT,c.interest>0?c.interest:NaN);
  v.eps=o.EPS; v.pe=d(c.price,o.EPS); v.dy=d(c.dps,c.price)*100; v.bvps=o.BVPS; v.pb=d(c.price,o.BVPS);
  return {o,v};
}
const f1=(n,d=2)=>Number.isFinite(n)?n.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d}):'n/a';
const FMT={x:n=>f1(n)+' : 1',times:n=>f1(n,1)+' times',pct:n=>f1(n,1)+'%',days:n=>f1(n,0)+' days',rs:n=>'Rs. '+f1(n),prop:n=>f1(n)};
// zones: [upper bound, class, message]; last bound Infinity. lo/hi = gauge range.
const Z=(arr)=>arr.map(a=>({to:a[0],cls:a[1],msg:a[2]}));
const RATIOS = {
  current:{n:'Current Ratio',w:'liq',f:'x',lo:0,hi:4,better:'mid',formula:'Current Assets / Current Liabilities',
    mean:'Can the firm pay everything due within one year?',ex:'Assets that turn to cash in a year are Rs. 200. Bills due in a year are Rs. 100. Ratio = 200 / 100 = 2 : 1.',
    num:'Current assets',den:'Current liabilities',levers:'cash, debtors, stock, creditors',
    zones:Z([[1,'bad','below 1. Bills due this year are bigger than the assets that can pay them. Danger.'],[1.5,'warn','just above 1. Tight. One bad month could hurt.'],[3,'good','healthy. The classic comfort level is 2 : 1.'],[Infinity,'warn','above 3. Safe, but money may be sitting idle in stock or cash.']])},
  quick:{n:'Quick (Acid Test) Ratio',w:'liq',f:'x',lo:0,hi:3,better:'mid',formula:'(Current Assets - Stock - Prepaid) / Current Liabilities',
    mean:'Can the firm pay bills without selling any stock?',ex:'Current assets Rs. 200, stock Rs. 80, prepaid Rs. 20, current liabilities Rs. 100. Quick = (200 - 80 - 20) / 100 = 1 : 1.',
    num:'Current assets - Stock - Prepaid',den:'Current liabilities',levers:'stock, prepaid, cash, debtors',
    zones:Z([[0.5,'bad','below 0.5. Without selling stock the firm cannot pay its bills.'],[1,'warn','below 1. It depends on selling stock to pay bills.'],[2.5,'good','1 or more. Bills can be paid without selling stock.'],[Infinity,'warn','very high. Cash may be lying idle.']])},
  cashr:{n:'Cash Ratio',w:'liq',f:'x',lo:0,hi:1.2,better:'mid',formula:'(Cash + Bank + Marketable Securities) / Current Liabilities',
    mean:'How much of the bills can be paid today, from cash alone?',ex:'Cash Rs. 30, securities Rs. 10, current liabilities Rs. 100. Cash ratio = 40 / 100 = 0.40.',
    num:'Cash + Securities',den:'Current liabilities',levers:'cash, securities, creditors',
    zones:Z([[0.1,'bad','below 0.1. Almost no cash buffer.'],[0.2,'warn','low. Thin cash cushion.'],[0.6,'good','a solid cash cushion.'],[Infinity,'warn','above 0.6. Lots of cash. Could it earn more if invested?']])},
  bdi:{n:'Basic Defense Interval',w:'liq',f:'days',lo:0,hi:150,better:'high',formula:'(Cash + Securities + Net Receivables) / Daily Operating Expenses',
    mean:'For how many days can the firm run without any new money coming in?',ex:'Cash 1,00,000 + securities 50,000 + receivables 50,000 = 2,00,000. Daily expenses 5,000. BDI = 2,00,000 / 5,000 = 40 days.',
    num:'Cash + Securities + Receivables',den:'Daily operating expenses',levers:'cash, debtors, costs',
    zones:Z([[30,'bad','under 30 days. A single month without sales would break the firm.'],[60,'warn','30 to 60 days. Okay, but not much room.'],[Infinity,'good','60 days or more. A strong survival cushion.']])},
  stock:{n:'Stock Turnover',w:'act',f:'times',lo:0,hi:16,better:'high',formula:'Cost of Goods Sold / Average Stock',
    mean:'How many times is the stock sold and replaced in a year?',ex:'COGS Rs. 600. Opening stock 50, closing stock 70, average = 60. Turnover = 600 / 60 = 10 times.',
    num:'Cost of goods sold',den:'Average stock',levers:'COGS, closing stock, opening stock',
    zones:Z([[4,'bad','under 4 times. Stock sits on the shelf for too long.'],[7,'warn','average for a shop. Room to move stock faster.'],[Infinity,'good','7+ times. Stock moves fast. Little money is stuck on shelves.']])},
  dtr:{n:'Debtors Turnover',w:'act',f:'times',lo:0,hi:30,better:'high',formula:'Net Credit Sales / Average Debtors',
    mean:'How many times a year does the firm collect its dues from customers?',ex:'Credit sales Rs. 600. Opening debtors 40, closing 60, average 50. Turnover = 600 / 50 = 12 times.',
    num:'Net credit sales',den:'Average debtors',levers:'sales, cash-sales %, debtors',
    zones:Z([[6,'bad','under 6 times. Customers pay slowly.'],[10,'warn','moderate collection speed.'],[Infinity,'good','10+ times. Customers pay quickly.']])},
  acp:{n:'Average Collection Period',w:'act',f:'days',lo:0,hi:120,better:'low',formula:'365 Days / Debtors Turnover',
    mean:'How many days does a customer take to pay?',ex:'Debtors turnover is 12 times. 365 / 12 = about 30 days to collect.',

function build(w){
  const pl=S.placed;
  let h='<p>Drag a card into the top (numerator) and bottom (denominator) boxes. On a phone or tablet, tap a card first, then tap a box.</p><div class="chips" id="pool">'+w.pool.map(t=>'<button class="chip" draggable="true" data-chip="'+esc(t)+'" data-act="chip">'+esc(t)+'</button>').join('')+'</div>';
  h+=w.build.map(b=>{const id=b[0],r=RATIOS[id],p=pl[id]||{},ok=S.done['b:'+id],full=p.num&&p.den,right=full&&p.num===b[1]&&p.den===b[2];
    const cls=(s,val,ans)=>'slot'+(val?' filled':'')+(ok?' ok':(full?(right?' ok':' no'):''));
    let res='';
    if(ok){const c=S.cos.A,k=calc(c);res='<p><b class="mono">'+FMT[r.f](k.v[id])+'</b> for Sharma Retail. '+zoneOf(id,k.v[id]).msg+'</p>'}
    else if(full&&!right)res='<p class="bad pill">Not quite. Tap a box to clear it and try again.</p>';
    return '<div class="qrow"><div><h3>'+r.n+'</h3><p class="muted">'+r.mean+'</p>'+res+'</div><div class="slotbox"><div class="'+cls('n',p.num)+'" data-slot="num" data-ratio="'+id+'">'+(p.num?esc(p.num):'drop numerator here')+'</div><div class="vinc"></div><div class="'+cls('d',p.den)+'" data-slot="den" data-ratio="'+id+'">'+(p.den?esc(p.den):'drop denominator here')+'</div></div></div>'}).join('');
  const all=w.build.every(b=>S.done['b:'+b[0]]);
  h+='<div class="nav2"><button class="btn alt" data-act="step" data-id="learn">&larr; Learn</button><button class="btn" data-act="step" data-id="lab">'+(all?'Next: Open the Lab &rarr;':'Skip to the Lab &rarr;')+'</button></div>';
  return h}
function place(id,slot,text){
  const w=WBY[S.view],b=w.build.find(x=>x[0]===id);if(!b)return;
  const p=S.placed[id]||(S.placed[id]={});p[slot]=text;
  if(p.num&&p.den&&p.num===b[1]&&p.den===b[2]&&!S.done['b:'+id]){S.done['b:'+id]=1;award(15,RATIOS[id].n+' built');badge('first');
    if(w.build.every(x=>S.done['b:'+x[0]])&&!S.done[w.id+':build']){S.done[w.id+':build']=1;setTimeout(()=>award(30,'All formulas in '+w.name+' built'),500)}save()}
  rerender()}
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-chip]');if(c){e.dataTransfer.setData('text/plain',c.dataset.chip);e.dataTransfer.effectAllowed='copy'}});
document.addEventListener('dragover',e=>{const s=e.target.closest('[data-slot]');if(s){e.preventDefault();s.classList.add('over')}});
document.addEventListener('dragleave',e=>{const s=e.target.closest('[data-slot]');if(s)s.classList.remove('over')});
document.addEventListener('drop',e=>{const s=e.target.closest('[data-slot]');if(s){e.preventDefault();const t=e.dataTransfer.getData('text/plain');if(t&&!S.done['b:'+s.dataset.ratio])place(s.dataset.ratio,s.dataset.slot,t)}});

/* ===== LAB ===== */
function inputsHTML(k,keys,pre){
  return keys.map(key=>{const f=FIELDS.find(x=>x[0]===key),c=S.cos[k];
    return '<div class="inp"><label for="'+pre+key+'">'+f[1]+'</label><input type="number" id="'+pre+key+'" data-co="'+k+'" data-key="'+key+'" value="'+c[key]+'" min="'+f[3]+'" step="'+f[5]+'"><input type="range" id="'+pre+key+'r" data-co="'+k+'" data-key="'+key+'" data-r="1" min="'+f[3]+'" max="'+Math.max(f[4],c[key])+'" step="'+f[5]+'" value="'+c[key]+'" aria-label="'+f[1]+' slider"></div>'}).join('')}
function lab(w){
  const m=w.mission,c=S.cos[S.co],done=S.done[w.id+':lab'];
  let h='<div class="mission '+(done?'done':'')+'"><b>'+(done?'Mission complete. ':'Mission on '+PRESETS[m.co].name+'. ')+'</b>'+m.text+(done?'':' <span class="muted">Hint: '+m.hint+'</span>')+'</div>';
  h+='<div class="co-tabs">'+['A','B','C'].map(k=>'<button class="step" aria-selected="'+(S.co===k)+'" data-act="co" data-id="'+k+'">'+PRESETS[k].name+'</button>').join('')+'<button class="btn alt" data-act="resetco">Reset this shop</button></div>';
  const rest=FIELDS.map(f=>f[0]).filter(k=>!w.fields.includes(k));
  h+='<p class="muted">Amounts are in Rs. lakh. Change a number or drag a slider. The ratios on the right update at once.</p>';
  h+='<div class="lab"><div class="card"><h3>Change the numbers</h3><div id="derived"></div>'+inputsHTML(S.co,w.fields,'f-')+'<details style="margin-top:.8rem"><summary><b>More numbers</b></summary>'+inputsHTML(S.co,rest,'g-')+'</details></div><div id="rcards"></div></div>';
  h+='<div class="nav2"><button class="btn alt" data-act="step" data-id="build">&larr; Build</button><button class="btn" data-act="step" data-id="quiz">Next: Quiz &rarr;</button></div>';
  return h}
function gauge(id,val){
  const r=RATIOS[id];let prev=r.lo,segs='';
  r.zones.forEach(z=>{const to=Math.min(z.to,r.hi);if(to>prev){segs+='<span class="z-'+z.cls+'" style="width:'+((to-prev)/(r.hi-r.lo)*100)+'%"></span>';prev=to}});
  const pos=Number.isFinite(val)?Math.max(0,Math.min(1,(val-r.lo)/(r.hi-r.lo)))*100:0;
  return '<div class="gauge" role="img" aria-label="gauge">'+segs+'<div class="pin" style="left:'+pos+'%"></div></div><div class="scale"><span>'+r.lo+'</span><span>'+r.hi+'+</span></div>'}
function cardHTML(id,c,k,tag){
  const r=RATIOS[id],val=k.v[id],z=zoneOf(id,val),p=PARTS(c,k.o,k.v)[id];
  return '<div class="rcard '+z.cls+'"><div class="rhead"><div><b>'+r.n+'</b><div class="muted" style="font-size:.8rem">'+esc(r.formula)+'</div></div><span class="pill '+z.cls+'">'+WORD[z.cls]+'</span></div>'
   +'<div class="rhead" style="margin-top:.4rem"><span class="rval">'+FMT[r.f](val)+'</span><span class="mono muted">'+f1(p[0],1)+' &divide; '+f1(p[1],1)+'</span></div>'+gauge(id,val)
   +'<div class="says"><b>What it says:</b> '+(tag||'')+'At '+FMT[r.f](val)+', this is '+z.msg+'</div></div>'}
function updateLab(){
  const w=WBY[S.view];if(!w||S.step!=='lab')return;
  const c=S.cos[S.co],k=calc(c);
  $('#rcards').innerHTML=w.ids.map(id=>cardHTML(id,c,k)).join('');
  const o=k.o;
  $('#derived').innerHTML='<div class="derived">Current assets <b>'+f1(o.CA,0)+'</b> &middot; Current liabilities <b>'+f1(o.CL,0)+'</b> &middot; Total assets <b>'+f1(o.TA,0)+'</b><br>Capital employed <b>'+f1(o.CE,0)+'</b> &middot; Shareholders funds <b>'+f1(o.SF,0)+'</b> (reserves balance automatically)<br>Gross profit <b>'+f1(o.GP,0)+'</b> &middot; PBIT <b>'+f1(o.EBIT,0)+'</b> &middot; Profit after tax <b>'+f1(o.PAT,1)+'</b></div>';
  const m=w.mission;
  if(!S.done[w.id+':lab']&&m.test(calc(S.cos[m.co]).v)){S.done[w.id+':lab']=1;save();award(m.xp,'Mission complete');checkWorld(w);const el=document.querySelector('.mission');if(el){el.classList.add('done');el.innerHTML='<b>Mission complete.</b> '+m.text}}
}
function checkWorld(w){if(S.done[w.id+':build']&&S.done[w.id+':lab']&&(S.done[w.id+':quiz']||0)>=2)badge(w.id)}
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.key)return;
  let v=parseFloat(t.value);if(!Number.isFinite(v))v=0;
  S.cos[t.dataset.co][t.dataset.key]=v;
  const id=t.id.replace(/r$/,''),twin=t.dataset.r?document.getElementById(id):document.getElementById(id+'r');
  if(twin){if(!t.dataset.r){twin.max=Math.max(twin.max,v);} twin.value=v}
  if(S.view==='arena')arenaUpdate();else updateLab()});

/* ===== QUIZ ===== */
function quiz(w){
  const Q=QUIZ[w.id],q=S.q;
  if(q.i>=Q.length){
    const best=Math.max(S.done[w.id+':quiz']||0,q.score);
    return '<div class="card"><h2>Quiz finished: '+q.score+' of '+Q.length+'</h2><p>'+(q.score>=2?'You earned the quiz star.':'Score 2 or more to earn the star. Try again.')+'</p><div class="nav2"><button class="btn alt" data-act="qretry">Play again</button><button class="btn" data-act="home">Back to the map</button></div></div>'}
  const it=Q[q.i];
  let h='<div class="card"><span class="pill info">Question '+(q.i+1)+' of '+Q.length+(q.streak>1?' &middot; streak x'+q.streak:'')+'</span><div class="scen">'+esc(it.s)+'</div><h3>'+esc(it.q)+'</h3>';
  h+=it.o.map((t,i)=>'<button class="opt '+(q.ans!==null?(i===it.a?'right':(i===q.ans?'wrong':'')):'')+'" data-act="ans" data-id="'+i+'" '+(q.ans!==null?'disabled':'')+'>'+esc(t)+'</button>').join('');
  if(q.ans!==null)h+='<p><b>'+(q.ans===it.a?'Correct. ':'Not this time. ')+'</b>'+esc(it.why)+'</p><button class="btn" data-act="qnext">'+(q.i+1>=Q.length?'See result':'Next question')+' &rarr;</button>';
  return h+'</div>'}
function answer(i){
  const w=WBY[S.view],it=QUIZ[w.id][S.q.i];if(S.q.ans!==null)return;
  S.q.ans=i;if(i===it.a){S.q.score++;S.q.streak++;award(20+(S.q.streak>1?5*(S.q.streak-1):0),S.q.streak>1?'Streak bonus':'Correct')}else S.q.streak=0;rerender()}
function qnext(){const w=WBY[S.view];S.q.i++;S.q.ans=null;
  if(S.q.i>=QUIZ[w.id].length){S.done[w.id+':quiz']=Math.max(S.done[w.id+':quiz']||0,S.q.score);save();if(S.q.score>=2)award(30,'Quiz passed');checkWorld(w)}
  rerender()}
/* ===== ARENA ===== */
S.pick={L:null,I:null};
function arena(){
  let h='<div class="crumbs"><button class="btn alt" data-act="home">&larr; Map</button><h2>The Arena</h2></div><p>Three shops, one market. Change any number below and every ratio, verdict and decision updates. Then make two real decisions like a banker and an investor.</p>';
  h+='<div class="card"><h3>Edit the numbers (Rs. lakh)</h3><details><summary><b>Open all inputs for the three shops</b></summary><div class="agrid">'+['A','B','C'].map(k=>'<div><h3>'+PRESETS[k].name+'</h3>'+inputsHTML(k,FIELDS.map(f=>f[0]),'a'+k+'-')+'<button class="btn alt" data-act="resetarena" data-id="'+k+'" style="margin-top:.6rem">Reset '+PRESETS[k].name+'</button></div>').join('')+'</div></details></div>';
  h+='<div id="asum" class="agrid"></div><h3 style="margin:1rem 0 .5rem">Ratio scoreboard</h3><div id="atable" class="tablewrap"></div><div id="adecide"></div>';
  return h}
function allScores(){const out={};['A','B','C'].forEach(k=>{const r=calc(S.cos[k]);out[k]=r});return out}
function pts(id,val){const c=zoneOf(id,val).cls;return c==='good'?2:c==='warn'?1:0}
function arenaUpdate(){
  const R=allScores(),keys=['A','B','C'];
  const groups=[['liq','Liquidity'],['act','Activity'],['pro','Profitability'],['sol','Solvency'],['mkt','Market test']];
  let t='<table><thead><tr><th>Ratio</th>'+keys.map(k=>'<th>'+PRESETS[k].name+'</th>').join('')+'</tr></thead><tbody>';
  groups.forEach(g=>{t+='<tr class="grp"><td colspan="4">'+g[1]+'</td></tr>';
    Object.keys(RATIOS).filter(id=>RATIOS[id].w===g[0]).forEach(id=>{const r=RATIOS[id];
      const vals=keys.map(k=>R[k].v[id]);let bestK=null;
      if((r.better==='high'||r.better==='low')&&vals.every(Number.isFinite)){const m=r.better==='high'?Math.max(...vals):Math.min(...vals);if(vals.filter(x=>x===m).length===1)bestK=keys[vals.indexOf(m)]}
      t+='<tr><td><b>'+r.n+'</b></td>'+keys.map((k,i)=>{const z=zoneOf(id,vals[i]);return '<td class="num '+(bestK===k?'best':'')+'">'+FMT[r.f](vals[i])+' <span class="pill '+z.cls+'">'+WORD[z.cls]+'</span></td>'}).join('')+'</tr>'})});
  t+='</tbody></table>';
  $('#atable').innerHTML=t;
  $('#asum').innerHTML=keys.map(k=>{const ids=Object.keys(RATIOS);let g=0,wn=0,b=0,worst=[];
    ids.forEach(id=>{const c=zoneOf(id,R[k].v[id]).cls;if(c==='good')g++;else if(c==='warn')wn++;else if(c==='bad'){b++;worst.push(RATIOS[id].n)}});
    return '<div class="card"><h3>'+PRESETS[k].name+'</h3><p class="muted">'+PRESETS[k].tag+'</p><p><span class="pill good">'+g+' healthy</span> <span class="pill warn">'+wn+' watch</span> <span class="pill bad">'+b+' danger</span></p><p>'+(worst.length?'<b>Biggest worries:</b> '+worst.slice(0,3).join(', ')+'.':'<b>No danger signs.</b>')+'</p></div>'}).join('')+'<div class="card" style="grid-column:1/-1"><span class="muted">The gold outline marks the best value among the three, where higher or lower is clearly better. Ratios like the current ratio have a comfort band instead, so none is crowned.</span></div>';
  decide(R)}
function score(R,k,ws){return ws.reduce((a,w)=>a+Object.keys(RATIOS).filter(id=>RATIOS[id].w===w).reduce((s,id)=>s+pts(id,R[k].v[id]),0),0)}
function decide(R){
  R=R||allScores();const keys=['A','B','C'];
  const D=[['L','Decision 1: You are a banker. Which shop gets the new loan?','Lenders want to be repaid. They study liquidity and solvency.',['liq','sol']],['I','Decision 2: You are an investor. Which shop gets your savings?','Investors want growth and returns. They study profitability and market ratios.',['pro','mkt']]];
  $('#adecide').innerHTML=D.map(d=>{const sc=Object.fromEntries(keys.map(k=>[k,score(R,k,d[3])])),mx=Math.max(...Object.values(sc)),pick=S.pick[d[0]];
    let res='';
    if(pick){const ok=sc[pick]===mx;const best=keys.filter(k=>sc[k]===mx).map(k=>PRESETS[k].name).join(' / ');
      res='<p><b>'+(ok?'Good choice. ':'Look again. ')+'</b>Scores: '+keys.map(k=>PRESETS[k].name+' <span class="mono">'+sc[k]+'</span>').join(', ')+'. Best: '+best+'.</p>';
      const key=d[0]==='L'?'arenaL':'arenaI';
      if(ok&&!S.done[key]){S.done[key]=1;save();award(40,'Arena decision');if(S.done.arenaL&&S.done.arenaI)badge('arena')}}
    return '<div class="card" style="margin-top:1rem"><h3>'+d[1]+'</h3><p class="muted">'+d[2]+' Score: healthy ratio = 2 points, watch = 1, danger = 0.</p><div class="co-tabs">'+keys.map(k=>'<button class="step" aria-selected="'+(pick===k)+'" data-act="pick" data-kind="'+d[0]+'" data-id="'+k+'">'+PRESETS[k].name+'</button>').join('')+'</div>'+res+'</div>'}).join('')}

/* ===== ROUTER ===== */
function rerender(){
  const a=$('#app');
  if(S.view==='home')a.innerHTML=home();
  else if(S.view==='arena'){a.innerHTML=arena();arenaUpdate()}
  else{a.innerHTML=world();if(S.step==='lab')updateLab()}
  hud()}
function go(view){S.view=view;S.step='learn';S.sel=null;S.placed={};S.q={i:0,score:0,streak:0,ans:null};const w=WBY[view];if(w)S.co=w.co;rerender();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const slot=e.target.closest('[data-slot]');
  if(slot){const id=slot.dataset.ratio;if(S.done['b:'+id])return;
    if(S.sel&&!(S.placed[id]&&S.placed[id][slot.dataset.slot])){place(id,slot.dataset.slot,S.sel);S.sel=null}
    else if(S.placed[id]&&S.placed[id][slot.dataset.slot]){S.placed[id][slot.dataset.slot]=null;rerender()}
    return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==='home')go('home');
  else if(a==='world')go(id);
  else if(a==='arena')go('arena');
  else if(a==='step'){S.step=id;if(id==='quiz')S.q={i:0,score:0,streak:0,ans:null};if(id==='lab')S.co=WBY[S.view].mission.co;rerender();window.scrollTo(0,0)}
  else if(a==='co'){S.co=id;rerender()}
  else if(a==='resetco'){resetCo(S.co);rerender()}
  else if(a==='resetarena'){resetCo(id);rerender();const d=$('#app details');if(d)d.open=true}
  else if(a==='chip'){S.sel=b.dataset.chip;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',c===b))}
  else if(a==='ans')answer(+id);
  else if(a==='qnext')qnext();
  else if(a==='qretry'){S.q={i:0,score:0,streak:0,ans:null};rerender()}
  else if(a==='pick'){S.pick[b.dataset.kind]=id;decide()}
  else if(a==='reset'){S.xp=0;S.done={};S.badges={};S.pick={L:null,I:null};['A','B','C'].forEach(resetCo);save();go('home');toast('Progress reset')}
});
hud();rerender();
</script>

</body></html>
